<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px 28px;
      height: fit-content;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #a0aec0;
      margin-bottom: 24px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      color: #2d3748;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row input::placeholder { color: #cbd5e0; }

    .btn-add {
      padding: 11px 18px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      line-height: 1;
    }

    .btn-add:hover { background: #5a67d8; }
    .btn-add:active { transform: scale(0.95); }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .filter-btn {
      flex: 1;
      padding: 7px 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: #718096;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      border-color: #667eea;
      background: #667eea;
      color: #fff;
      font-weight: 600;
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 60px;
    }

    .empty {
      text-align: center;
      color: #cbd5e0;
      font-size: 0.9rem;
      padding: 32px 0;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f7fafc;
      transition: background 0.15s, opacity 0.2s;
    }

    .item:hover { background: #edf2f7; }

    .item.done { opacity: 0.55; }

    .item.done .item-text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      background: #fff;
    }

    .item.done .checkbox {
      background: #667eea;
      border-color: #667eea;
    }

    .checkbox svg {
      display: none;
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }

    .item.done .checkbox svg { display: block; }

    .item-text {
      flex: 1;
      font-size: 0.95rem;
      color: #2d3748;
      word-break: break-word;
    }

    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e0;
      font-size: 1.1rem;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .btn-delete:hover { color: #fc8181; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .count {
      font-size: 0.82rem;
      color: #a0aec0;
    }

    .btn-clear {
      background: none;
      border: none;
      color: #fc8181;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .btn-clear:hover { background: #fff5f5; }
  </style>
</head>
<body>
<div class="app">
  <h1>Shopping List</h1>
  <p class="subtitle" id="date"></p>

  <div class="input-row">
    <input type="text" id="input" placeholder="아이템 추가..." maxlength="80">
    <button class="btn-add" id="btnAdd" title="추가">+</button>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="active">미완료</button>
    <button class="filter-btn" data-filter="done">완료</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="footer">
    <span class="count" id="count"></span>
    <button class="btn-clear" id="btnClear">완료 삭제</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'shopping-list-v1';
  let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let filter = 'all';

  const inputEl  = document.getElementById('input');
  const listEl   = document.getElementById('list');
  const countEl  = document.getElementById('count');
  const btnAdd   = document.getElementById('btnAdd');
  const btnClear = document.getElementById('btnClear');
  const dateEl   = document.getElementById('date');

  dateEl.textContent = new Date().toLocaleDateString('ko-KR', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
  });

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function addItem() {
    const text = inputEl.value.trim();
    if (!text) return;
    items.unshift({ id: Date.now(), text, done: false });
    inputEl.value = '';
    save();
    render();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.done = !item.done;
    save();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function clearDone() {
    items = items.filter(i => !i.done);
    save();
    render();
  }

  function render() {
    const visible = items.filter(i =>
      filter === 'all'    ? true :
      filter === 'active' ? !i.done :
                             i.done
    );

    const remaining = items.filter(i => !i.done).length;
    countEl.textContent = `${remaining}개 남음 / 총 ${items.length}개`;

    if (visible.length === 0) {
      listEl.innerHTML = '<li class="empty">아이템이 없습니다</li>';
      return;
    }

    listEl.innerHTML = visible.map(item => `
      <li class="item${item.done ? ' done' : ''}" data-id="${item.id}">
        <div class="checkbox" data-action="toggle">
          <svg viewBox="0 0 12 12"><polyline points="1.5,6 5,9.5 10.5,2.5"/></svg>
        </div>
        <span class="item-text">${escapeHtml(item.text)}</span>
        <button class="btn-delete" data-action="delete" title="삭제">&#10005;</button>
      </li>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  btnAdd.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });
  btnClear.addEventListener('click', clearDone);

  listEl.addEventListener('click', e => {
    const li = e.target.closest('[data-id]');
    if (!li) return;
    const id = Number(li.dataset.id);
    const action = e.target.closest('[data-action]')?.dataset.action;
    if (action === 'toggle') toggleItem(id);
    if (action === 'delete') deleteItem(id);
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      filter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  render();
</script>
</body>
</html>
